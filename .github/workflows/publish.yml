name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build the page
        run: |
          set -euo pipefail
          mkdir -p public
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>unkernel</title>
              <style>
                html, body { margin: 0; height: 100%; background: #0b0b0c; }
                iframe { display: block; width: 100%; height: 100%; border: 0; }
              </style>
            </head>
            <body>
              <iframe
                src="https://unkernel.dev/"
                title="unkernel — a real Linux kernel compiled to WebAssembly"
                allow="clipboard-read; clipboard-write"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
            </body>
          </html>
          HTML
          echo "built $(wc -c < public/index.html) bytes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
